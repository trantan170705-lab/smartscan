[package]
name = "wasm-scanner"
version = "0.1.0"
edition = "2021"
description = "Pure Rust WebAssembly image processing and document scanning engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

image = { version = "0.25.0", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.25.0", default-features = false }
lopdf = { version = "0.35.0", default-features = false, features = ["nom_parser"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
